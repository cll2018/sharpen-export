# Decap CMS configuration.
# Login goes through our self-hosted GitHub OAuth proxy (Pages Functions):
#   /decap/auth -> GitHub authorize -> /decap/auth/callback -> token
backend:
  name: github
  repo: cll2018/sharpen-export
  branch: main
  base_url: https://www.sapu-cn.online
  auth_endpoint: decap/auth
  site_url: https://www.sapu-cn.online
  squash_merges: true

# Allow local testing via `npx decap-server` (set local_backend: true).
local_backend: false

media_folder: "assets/img"
public_folder: "/assets/img"

publish_mode: editorial_workflow

# UI 界面语言：使用 Decap CMS 内置的简体中文语言包（顶栏、编辑器按钮、
# 工作流弹窗等系统文案）。个别此版本未翻译的键会回退英文。
locale: zh_Hans

collections:
  - name: "pages-zh"
    label: "页面"
    description: "内容源语种（简体中文）。在这里修改并发布后，GitHub Action 会自动把改动翻译同步到其余 13 个语种，无需手工处理其它语言。"
    files:
      - name: home-zh
        label: "首页"
        file: "zh/index.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "横幅大标题", name: "heroTitle", widget: "string" }
          - { label: "横幅导语", name: "heroLead", widget: "text" }
          - { label: "固定网址（由文件路径决定）", name: "permalink", widget: "hidden", default: "/zh/" }
      - name: products-zh
        label: "产品"
        file: "zh/products.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "正文", name: "body", widget: "markdown" }
          - { label: "固定网址（由文件路径决定）", name: "permalink", widget: "hidden", default: "/zh/products/" }
      - name: about-zh
        label: "关于我们"
        file: "zh/about.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "正文", name: "body", widget: "markdown" }
          - { label: "固定网址（由文件路径决定）", name: "permalink", widget: "hidden", default: "/zh/about/" }
      - name: contact-zh
        label: "联系我们"
        file: "zh/contact.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "正文", name: "body", widget: "markdown" }
          - { label: "固定网址（由文件路径决定）", name: "permalink", widget: "hidden", default: "/zh/contact/" }
      - name: news-zh
        label: "新闻"
        file: "zh/news.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "正文", name: "body", widget: "markdown" }
          - { label: "固定网址（由文件路径决定）", name: "permalink", widget: "hidden", default: "/zh/news/" }

      - name: privacy-zh
        label: "隐私政策"
        file: "zh/privacy.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "正文", name: "body", widget: "markdown" }
          - { label: "固定网址（由文件路径决定）", name: "permalink", widget: "hidden", default: "/zh/privacy/" }
      - name: search-zh
        label: "搜索"
        file: "zh/search.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "正文", name: "body", widget: "markdown" }
          - { label: "固定网址（由文件路径决定）", name: "permalink", widget: "hidden", default: "/zh/search/" }
  - name: "news-zh"
    label: "新闻文章"
    description: "内容源语种（简体中文）。在这里修改并发布后，GitHub Action 会自动把改动翻译同步到其余 13 个语种，无需手工处理其它语言。"
    label_new: "新增新闻 · 中文（简体）"
    folder: "zh/news"
    create: true
    delete: true
    slug: "{{newsSlug}}"
    editor:
      preview: false
    sortable_fields: ["newsDate", "title"]
    view_filters:
      - { label: "全部栏目", field: "newsSection", pattern: ".*" }
      - { label: "公司新闻", field: "newsSection", pattern: "公司新闻" }
      - { label: "行业资讯", field: "newsSection", pattern: "行业资讯" }
      - { label: "行业前沿发展现状", field: "newsSection", pattern: "行业前沿发展现状" }
    fields:
      - { label: "发布日期", name: "newsDate", widget: "string", required: false,
          pattern: ['^\d{4}-\d{2}-\d{2}$', '^\d{4}-\d{2}-\d{2}$'],
          hint: "格式 YYYY-MM-DD，例 2026-10-03。留空则列表不显示日期；排序按日期由新到旧。" }
      - { label: "页面类型", name: "pageType", widget: "hidden", default: "news" }
      - { label: "栏目", name: "newsSection", widget: "select",
          options: ["公司新闻", "行业资讯", "行业前沿发展现状"], default: "公司新闻" }
      - { label: "标题", name: "title", widget: "string" }
      - { label: "SEO 描述", name: "description", widget: "text",
          hint: "列表页卡片摘要与搜索结果摘要，写 1-2 句。" }
      - { label: "URL 别名", name: "newsSlug", widget: "string", required: true,
          hint: "小写英文，用短横线分隔，例 tinico-heat-spreader-dev；建议与文件名保持一致。" }
      - { label: "正文", name: "body", widget: "markdown" }
      - { label: "版式", name: "layout", widget: "hidden", default: "news-detail.njk" }
      - { label: "语言代码", name: "lang", widget: "hidden", default: "zh" }

  # ---- 产品介绍 · 中文（简体）（可新增/编辑）----
  - name: "products-zh"
    label: "产品介绍"
    description: "内容源语种（简体中文）。在这里修改并发布后，GitHub Action 会自动把改动翻译同步到其余 13 个语种，无需手工处理其它语言。"
    label_new: "新增产品 · 中文（简体）"
    folder: "zh/products"
    create: true
    delete: true
    slug: "{{productId}}"
    editor:
      preview: false
    sortable_fields: ["title"]
    fields:
      - { label: "产品名称", name: "title", widget: "string" }
      - { label: "SEO 描述", name: "description", widget: "text",
          hint: "写 1-2 句，用于搜索结果摘要。" }
      - { label: "卡片简介", name: "summary", widget: "text", hint: "首页与产品列表卡片上的简介文字（1-2 句）。" }
      - { label: "产品锚点 ID", name: "productId", widget: "string", required: true,
          hint: "小写英文短横线，例 strong-grooving-wheels。产品列表的锚点链接会用到。" }
      - { label: "产品图", name: "productImage", widget: "image", required: false,
          hint: "先在媒体库上传，再选择文件。" }
      - label: "产品详情 HTML"
        name: "body"
        widget: "code"
        default: |
          <div class="product-block">
            <img class="pb-img" src="/assets/img/your-product.webp" alt="" loading="lazy" />
            <div>
              <h2>产品名称</h2>
              <p>一段产品介绍。</p>
              <ul class="specs">
                <li>特点一</li>
                <li>特点二</li>
              </ul>
              <div class="pb-cta"><a class="btn btn-primary" href="/zh/contact/">索取报价</a></div>
            </div>
          </div>
        hint: "请保留上面的 HTML 结构，只替换引号内的文字；图片地址填已上传的文件；联系按钮的路径必须是 /zh/contact/。留空则产品列表不显示该产品。"
      - { label: "版式", name: "layout", widget: "hidden", default: "product-detail.njk" }
      - { label: "页面类型", name: "pageType", widget: "hidden", default: "product" }
      - { label: "语言代码", name: "lang", widget: "hidden", default: "zh" }

