# Decap CMS configuration.
# Login goes through our self-hosted GitHub OAuth proxy (Pages Functions):
#   /decap/auth -> GitHub authorize -> /decap/auth/callback -> token
backend:
  name: github
  repo: cll2018/sharpen-export
  branch: main
  base_url: https://www.sapu-cn.online
  auth_endpoint: decap/auth
  site_url: https://www.sapu-cn.online
  squash_merges: true

# Allow local testing via `npx decap-server` (set local_backend: true).
local_backend: false

media_folder: "assets/img"
public_folder: "/assets/img"

publish_mode: editorial_workflow

collections:
  - name: "pages-en"
    label: "Pages (English)"
    files:
      - name: home-en
        label: "Home (EN)"
        file: "en/index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Lead", name: "heroLead", widget: "text" }
      - name: products-en
        label: "Products (EN)"
        file: "en/products.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: about-en
        label: "About (EN)"
        file: "en/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: contact-en
        label: "Contact (EN)"
        file: "en/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages-zh"
    label: "Pages (中文)"
    files:
      - name: home-zh
        label: "首页 (ZH)"
        file: "zh/index.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "横幅大标题", name: "heroTitle", widget: "string" }
          - { label: "横幅导语", name: "heroLead", widget: "text" }
      - name: products-zh
        label: "产品 (ZH)"
        file: "zh/products.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "正文", name: "body", widget: "markdown" }
      - name: about-zh
        label: "关于我们 (ZH)"
        file: "zh/about.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "正文", name: "body", widget: "markdown" }
      - name: contact-zh
        label: "联系我们 (ZH)"
        file: "zh/contact.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "正文", name: "body", widget: "markdown" }

  # ---- AI chat settings: EDITABLE IN THE BACKEND ----
  # Change model, API base URL (any OpenAI-compatible), system prompt, or
  # enable/disable the bot here. The secret API key is NOT stored here — it
  # lives in the Cloudflare Pages env var AI_LLM_API_KEY.
  - name: "ai-settings"
    label: "AI Chat Settings"
    files:
      - name: settings
        label: "AI Chat Config"
        file: "data/settings.json"
        fields:
          - { name: enabled, label: "Enable AI auto-reply", widget: boolean }
          - { name: provider, label: "Provider", widget: string, hint: "openai-compatible" }
          - { name: apiBaseUrl, label: "API Base URL", widget: string, hint: "e.g. https://api.openai.com/v1 or https://api.deepseek.com/v1" }
          - { name: model, label: "Model", widget: string, hint: "e.g. gpt-4o-mini / deepseek-chat" }
          - { name: systemPrompt, label: "System Prompt", widget: text }
          - { name: fallbackMessage, label: "Fallback Message", widget: text }
