      - name: home-zh-tw
        label: "首頁 (ZH-TW)"
        file: "zh-tw/index.md"
        fields:
          - { label: "標題", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "橫幅大標題", name: "heroTitle", widget: "string" }
          - { label: "橫幅導語", name: "heroLead", widget: "text" }
      - name: products-zh-tw
        label: "產品 (ZH-TW)"
        file: "zh-tw/products.md"
        fields:
          - { label: "標題", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "正文", name: "body", widget: "markdown" }
      - name: about-zh-tw
        label: "關於我們 (ZH-TW)"
