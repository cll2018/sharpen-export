  - name: "site-info"
    label: "站点信息"
    description: "站点信息（品牌名、联系方式、导航、页脚）。这里只维护中文相关的字段，其余语种会自动翻译。"
    files:
      - name: site-info
        label: "站点信息"
        file: "data/site.json"
        fields:
          - { label: "公司全称（英文）", name: "name", widget: "string", required: false }
          - { label: "公司全称（中文）", name: "nameZh", widget: "string", required: false }
          - { label: "公司全称（繁体）", name: "nameZhTw", widget: "string", required: false }
          - { label: "品牌简称", name: "shortName", widget: "string", required: false }
          - { label: "域名（用于 canonical/hreflang）", name: "domain", widget: "string", required: false }
          - { label: "网站标识", name: "logo", widget: "image", required: false }
          - { label: "产品手册 PDF", name: "brochure", widget: "file", required: false }
          - { label: "邮箱", name: "email", widget: "string", required: false }
          - { label: "电话", name: "phone", widget: "string", required: false }
          - { label: "微信", name: "wechat", widget: "string", required: false }
          - { label: "WhatsApp 号码（含国家码，不带 +）", name: "whatsapp", widget: "string", required: false }
          - { label: "地址（英文）", name: "address", widget: "string", required: false }
          - { label: "地址（中文）", name: "addressZh", widget: "string", required: false }
          - { label: "地址（繁体）", name: "addressZhTw", widget: "string", required: false }
          - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
