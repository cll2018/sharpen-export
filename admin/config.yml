    description: "由简体中文自动同步生成（GitHub Action: i18n sync）。一般不需要手改；手改会在下次中文更新时被覆盖。"
    label_new: "新增产品 · العربية"
    folder: "ar/products"
    create: true
    delete: true
    slug: "{{productId}}"
    editor:
      preview: false
    sortable_fields: ["title"]
    fields:
      - { label: "产品名称", name: "title", widget: "string" }
      - { label: "SEO 描述", name: "description", widget: "text",
          hint: "写 1-2 句，用于搜索结果摘要。" }
      - { label: "卡片简介", name: "summary", widget: "text", hint: "Short summary shown on the home & products cards (1-2 sentences)." }
      - { label: "产品锚点 ID", name: "productId", widget: "string", required: true,
          hint: "小写英文短横线，例 strong-grooving-wheels。产品列表的锚点链接会用到。" }
      - { label: "产品图", name: "productImage", widget: "image", required: false,
          hint: "先在媒体库上传，再选择文件。" }
      - label: "产品详情 HTML"
        name: "body"
        widget: "code"
        default: |
          <div class="product-block">
            <img class="pb-img" src="/assets/img/your-product.webp" alt="" loading="lazy" />
            <div>
              <h2>产品名称</h2>
              <p>一段产品介绍。</p>
              <ul class="specs">
                <li>特点一</li>
                <li>特点二</li>
              </ul>
              <div class="pb-cta"><a class="btn btn-primary" href="/ar/contact/">اطلب عرض سعر</a></div>
            </div>
          </div>
        hint: "请保留上面的 HTML 结构，只替换引号内的文字；图片地址填已上传的文件；联系按钮的路径必须是 /ar/contact/。留空则产品列表不显示该产品。"
      - { label: "版式", name: "layout", widget: "hidden", default: "product-detail.njk" }
      - { label: "页面类型", name: "pageType", widget: "hidden", default: "product" }
      - { label: "语言代码", name: "lang", widget: "hidden", default: "ar" }

  # ---- 新闻文章 · Tiếng Việt（可新增/编辑/删除）----
  - name: "news-vi"
    label: "新闻文章 · 越南语"
    description: "由简体中文自动同步生成（GitHub Action: i18n sync）。一般不需要手改；手改会在下次中文更新时被覆盖。"
    label_new: "新增新闻 · Tiếng Việt"
    folder: "vi/news"
    create: true
    delete: true
    slug: "{{newsSlug}}"
    editor:
      preview: false
    sortable_fields: ["newsDate", "title"]
    view_filters:
      - { label: "全部栏目", field: "newsSection", pattern: ".*" }
      - { label: "公司新闻", field: "newsSection", pattern: "Tin doanh nghiệp" }
      - { label: "行业资讯", field: "newsSection", pattern: "Tin ngành" }
      - { label: "行业前沿发展现状", field: "newsSection", pattern: "Công nghệ tiên tiến" }
    fields:
      - { label: "发布日期", name: "newsDate", widget: "string", required: false,
          pattern: ['^\d{4}-\d{2}-\d{2}$', '^\d{4}-\d{2}-\d{2}$'],
          hint: "格式 YYYY-MM-DD，例 2026-10-03。留空则列表不显示日期；排序按日期由新到旧。" }
      - { label: "页面类型", name: "pageType", widget: "hidden", default: "news" }
      - { label: "栏目", name: "newsSection", widget: "select",
          options: ["Tin doanh nghiệp", "Tin ngành", "Công nghệ tiên tiến"], default: "Tin doanh nghiệp" }
      - { label: "标题", name: "title", widget: "string" }
      - { label: "SEO 描述", name: "description", widget: "text",
          hint: "列表页卡片摘要与搜索结果摘要，写 1-2 句。" }
      - { label: "URL 别名", name: "newsSlug", widget: "string", required: true,
          hint: "小写英文，用短横线分隔，例 tinico-heat-spreader-dev；建议与文件名保持一致。" }
      - { label: "正文", name: "body", widget: "markdown" }
      - { label: "版式", name: "layout", widget: "hidden", default: "news-detail.njk" }
      - { label: "语言代码", name: "lang", widget: "hidden", default: "vi" }

