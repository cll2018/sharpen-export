        fields:
          - { label: "標題", name: "title", widget: "string" }
          - { label: "描述 (SEO)", name: "description", widget: "text" }
          - { label: "正文", name: "body", widget: "markdown" }

  # ---- AI chat settings: EDITABLE IN THE BACKEND ----
  # Change model, API base URL (any OpenAI-compatible), system prompt, or
  # enable/disable the bot here. The secret API key is NOT stored here — it
  # lives in the Cloudflare Pages env var AI_LLM_API_KEY.
  - name: "ai-settings"
    label: "AI Chat Settings"
    files:
      - name: settings
        label: "AI Chat Config"
        file: "data/settings.json"
        fields:
          - { name: enabled, label: "Enable AI auto-reply", widget: boolean }
          - { name: provider, label: "Provider", widget: string, hint: "openai-compatible" }
          - { name: apiBaseUrl, label: "API Base URL", widget: string, hint: "e.g. https://api.openai.com/v1 or https://api.deepseek.com/v1" }
          - { name: model, label: "Model", widget: string, hint: "e.g. gpt-4o-mini / deepseek-chat" }
          - { name: systemPrompt, label: "System Prompt", widget: text }
          - { name: fallbackMessage, label: "Fallback Message", widget: text }

  # ---- 新闻文章 · English（可新增/编辑/删除）----
  - name: "news-en"
    label: "新闻文章 · English"
    label_new: "新增新闻 · English"
    folder: "en/news"
    create: true
    delete: true
    slug: "{{slug}}"
    editor:
      preview: false
    sortable_fields: ["newsDate", "title"]
    view_filters:
      - { label: "全部栏目", field: "newsSection", pattern: ".*" }
      - { label: "Company News", field: "newsSection", pattern: "Company News" }
      - { label: "Industry News", field: "newsSection", pattern: "Industry News" }
      - { label: "Industry Frontier", field: "newsSection", pattern: "Industry Frontier" }
    fields:
      - { label: "发布日期", name: "newsDate", widget: "string", required: false,
          pattern: ['^\d{4}-\d{2}-\d{2}$', '^\d{4}-\d{2}-\d{2}$'],
          hint: "格式 YYYY-MM-DD，例 2026-10-03。留空则列表不显示日期；排序按日期由新到旧。" }
      - { label: "栏目", name: "newsSection", widget: "select",
          options: ["Company News", "Industry News", "Industry Frontier"], default: "Company News" }
      - { label: "标题", name: "title", widget: "string" }
      - { label: "SEO 描述", name: "description", widget: "text",
          hint: "列表页卡片摘要与搜索结果摘要，写 1-2 句。" }
      - { label: "URL Slug", name: "newsSlug", widget: "string",
          hint: "小写英文，用短横线分隔，例 tinico-heat-spreader-dev；建议与文件名保持一致。" }
      - { label: "正文", name: "body", widget: "markdown" }
      - { label: "版式", name: "layout", widget: "hidden", default: "news-detail.njk" }
      - { label: "语言代码", name: "lang", widget: "hidden", default: "en" }

  # ---- 产品介绍 · English（可新增/编辑）----
  - name: "products-en"
    label: "产品介绍 · English"
    label_new: "新增产品 · English"
    folder: "en/products"
    create: true
    delete: true
    slug: "{{slug}}"
    editor:
      preview: false
    sortable_fields: ["title"]
    fields:
      - { label: "产品名称", name: "title", widget: "string" }
      - { label: "SEO 描述", name: "description", widget: "text",
          hint: "写 1-2 句，用于搜索结果摘要。" }
      - { label: "产品锚点 ID", name: "productId", widget: "string",
          hint: "小写英文短横线，例 strong-grooving-wheels。产品列表的锚点链接会用到。" }
      - { label: "产品图", name: "productImage", widget: "image", required: false,
          hint: "先在媒体库上传，再选择文件。" }
      - label: "产品详情 HTML"
        name: "body"
        widget: "code"
        default: |
          <div class="product-block">
            <img class="pb-img" src="/assets/img/your-product.webp" alt="" loading="lazy" />
            <div>
              <h2>产品名称</h2>
              <p>一段产品介绍。</p>
              <ul class="specs">
                <li>特点一</li>
                <li>特点二</li>
              </ul>
              <div class="pb-cta"><a class="btn btn-primary" href="/en/contact/">Request a quote</a></div>
            </div>
          </div>
        hint: "请保留上面的 HTML 结构，只替换引号内的文字；图片地址填已上传的文件；联系按钮的路径必须是 /en/contact/。留空则产品列表不显示该产品。"
      - { label: "版式", name: "layout", widget: "hidden", default: "product-detail.njk" }
      - { label: "页面类型", name: "pageType", widget: "hidden", default: "product" }
      - { label: "语言代码", name: "lang", widget: "hidden", default: "en" }

